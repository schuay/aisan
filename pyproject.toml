[project]
name = "aisan"
version = "0.1.1"
description = "Linux confinement and credential-aware egress for build and coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jakob Linke" }]
keywords = ["bubblewrap", "sandbox", "security", "egress", "reapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Keep the package installable without a sibling checkout.
dependencies = [
    # aiohttp serves HTTP proxies; h2 serves the plaintext REAPI transport.
    "aiohttp>=3.9",
    "h2>=4.1",
]

[project.optional-dependencies]
# Vertex uses Google ADC impersonation. RBE invokes external luci-auth.
google-auth = [
    # Credential refresh imports google.auth.transport.requests at import time.
    "google-auth[requests]>=2.0",
]

[project.scripts]
# Boxes invoke the low-level launcher through an absolute interpreter path.
aisan = "aisan.cli.main:main"
aisan-box-launch = "aisan.launch:main"

[project.urls]
Homepage = "https://github.com/schuay/aisan"
Repository = "https://github.com/schuay/aisan"
Issues = "https://github.com/schuay/aisan/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisan"]

[tool.hatch.build.targets.sdist]
# Hatchling doesn't honor checkout-local .git/info/exclude entries.
exclude = ["/AGENTS.md", "/CLAUDE.md", "/GEMINI.md"]

# Keep lint policy in one place and allow new Ruff releases to surface findings.
[tool.ruff.lint]
extend-select = [
    "B",      # bugbear correctness checks
    "BLE",    # blind except -- see the ignore below
    "C4",     # comprehension misuse
    "DTZ",    # naive datetimes: this codebase has been bitten by expiry handling
    "G",      # logging call shape
    "ISC",    # implicit string concat, i.e. the missing-comma bug
    "PL",     # pylint subset
    "RET",    # return-path smells
    "RUF",
    "S",      # bandit subset
    "SIM",
    "TRY",    # exception antipatterns
    "UP",     # pyupgrade
]
ignore = [
    # Boundary callbacks and best-effort cleanup must contain undocumented
    # library exceptions. S110 still rejects silent handlers.
    "BLE001",
    # Asserts in tests are the point.
    "S101",
    # Local imports preserve optional dependencies and process-boundary cycles.
    "PLC0415",
    # Assertion literals state expected values directly.
    "PLR2004",
    # Inline exception messages stay beside their conditions.
    "TRY003",
    # Complexity refactors need separate review instead of inline suppressions.
    "PLR0913",
    "PLR0917",
    "PLR0912",
    "PLR0915",
    "PLR0911",
    # Timeouts have no useful traceback; parse errors already include the error.
    "TRY400",
    # google-auth exposes credential expiry as naive UTC. Normalising that
    # third-party value is safer than mixing aware and naive datetimes.
    "DTZ001",
    "DTZ006",
    "DTZ007",
    # A normalization regex intentionally contains Unicode dash data.
    "RUF001",
    # Keyword-form dicts can mirror the attributes of test doubles.
    "C408",
    # Host and box commands intentionally resolve Git through different PATHs.
    "S603",
    "S607",
    # Most backends need no prepare or preflight override.
    "B027",
    # Keep every h2 event-dispatch arm in the same visual form.
    "SIM102",
]

# Keep test-only exceptions from reducing source coverage.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S105",  # "token"/"password" literals in fixtures are fake by construction
    "S106",
    "S108",  # /tmp paths in tests are the test's own scratch
    "S103",  # chmod 0o755 to set up a permissions fixture
    "S603",  # subprocess in a test harness, with fixed argv
    "S607",
    "B017",  # some tests assert an arbitrary callback failure
    "RUF012",  # test doubles use shared mutable fixtures
    "ASYNC221",  # synchronous Git calls prepare async tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default runs exclude host-installed agent CLIs with version-dependent wire
# formats. Run them while pinning a client version with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: spawns a third-party agent CLI installed on the host",
]
