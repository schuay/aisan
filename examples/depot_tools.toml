# Example user binds for a Chromium depot_tools checkout. Pass this file with
# `aisan claude --binds` and inspect the result with `--explain`.
#
# Adjust these paths for the host. Repeat `--binds` to add a project-specific file.
#
# Prefer the built-in depot_tools grant:
#
#     aisan claude /path/to/v8 --grant depot_tools
#
# The grant discovers these paths and disables depot_tools network updates.

ro = [
    "~/depot_tools",
]

overlay = [
    # vpython locks this cache even for reads. The overlay supplies the warm host
    # cache, keeps box writes private, and avoids an offline rebuild. Replace
    # `.1000` with the local uid from `id -u`.
    "~/.cache/vpython-root.1000",
]

path = [
    # Make the mounted depot_tools commands discoverable.
    "~/depot_tools",
]
